<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>enza カード索引</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="eyebrow">SHINY COLORS / ENZA</div><h1>カードを探す。</h1><p>P・Sカードの非公式検索索引。詳しい情報は各カードのWikiへ。</p></header>
<main><aside id="coverage">読み込み中…</aside><section class="controls" aria-label="検索条件"><label class="query">カード・アイドル・ユニット<input id="q" type="search" placeholder="例：櫻木真乃 ほわっと"></label><div id="filters"></div><div class="dates"><label>実装日から<input id="from" type="date"></label><label>実装日まで<input id="to" type="date"></label><label><input id="missing" type="checkbox">不明項目あり</label></div><div class="sorting"><label>並べ替え<select id="sort"></select></label><label>順序<select id="direction"><option value="desc">降順</option><option value="asc">昇順</option></select></label><button id="reset">条件をリセット</button></div></section>
<section class="results"><div class="toolbar"><h2 id="count" aria-live="polite">カード</h2><button id="export">検索結果CSV</button></div><div id="cards"></div></section>
<footer><h2>データと収録範囲</h2><p id="version"></p><nav id="downloads" aria-label="全件データ取得"></nav><details><summary>出典・確認状況</summary><p>対象はenza版です。性能・画像・本文は収録しません。Wiki掲載情報は公式の独立照合を終えていません。不明項目を推測で補いません。編集原本の変更は、検証して新しい版を公開した時に反映します。</p><pre id="audit"></pre></details></footer></main>
