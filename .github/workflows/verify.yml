name: Verify reproducible public build
on:
  workflow_call:
    inputs:
      publish_artifact:
        description: Upload the exact tested site as the Pages artifact
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'site/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'site/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.14'
          - os: windows-latest
            python: '3.13.16'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      XLSX_BACKEND: stdlib
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - run: python -m pip install -r requirements.txt
      - name: Validate committed release and record exact bytes
        run: python scripts/check_release.py site --record "${{ runner.temp }}/verified-site.json"
      - run: python scripts/run_unit_tests_ci.py
      - run: node --test tests/search.test.mjs tests/detail-search.test.mjs tests/compound-passive.test.mjs
      - if: runner.os == 'Linux'
        run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:ui
      - if: runner.os == 'Linux'
        run: npm run test:search-ui
      - name: Require the tested release tree to remain unchanged
        run: python scripts/check_release.py site --compare "${{ runner.temp }}/verified-site.json"
      - name: Upload the exact tested Pages artifact
        if: runner.os == 'Linux' && inputs.publish_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Require the uploaded Pages archive to match the tested release
        if: runner.os == 'Linux' && inputs.publish_artifact
        run: python scripts/check_release.py site --compare "${{ runner.temp }}/verified-site.json" --artifact "${{ runner.temp }}/artifact.tar"
