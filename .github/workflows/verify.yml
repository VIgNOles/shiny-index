name: Verify reproducible public build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'site/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'site/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.14'
          - os: windows-latest
            python: '3.13.16'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      XLSX_BACKEND: stdlib
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_unit_tests_ci.py
      - run: node --test tests/search.test.mjs tests/detail-search.test.mjs
      - run: python scripts/check_site.py site
      - if: runner.os == 'Linux'
        run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python scripts/refresh_ui_assets.py site
      - if: runner.os == 'Linux'
        run: npm run test:ui
