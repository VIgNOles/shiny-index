name: Publish validated site
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'publish: ') }}"
    uses: ./.github/workflows/verify.yml
    with:
      publish_artifact: true
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Check distribution conditions
        run: python -c "import json; assert json.load(open('source_manifest.json'))['public_distribution_enabled'], 'Distribution conditions unresolved'"
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
